<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>تركس</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="home">
  <div class="logo-cards">
    <div class="mini-card red">A<span>♥</span></div>
    <div class="mini-card">7<span>♠</span></div>
    <div class="mini-card red">Q<span>♦</span></div>
    <div class="mini-card">K<span>♣</span></div>
  </div>
  <h1>تـركـس</h1>
  <p class="sub">لعبة الورق الشهيرة — سلب، بنات، قلوب، شعبان وتركيس</p>
  <button class="btn big" id="btnStart" type="button">ابدأ اللعب</button>
  <button class="btn ghost" id="btnRules" type="button">قوانين اللعبة</button>
</div>

<div id="game" hidden>
  <div id="bar">
    <div class="chip" id="roundChip">الجولة 1/5</div>
    <div class="chip gold" id="contractChip">—</div>
    <div class="chip" id="heartsChip" hidden>♥ مفتوح</div>
    <div id="status">—</div>
  </div>
  <div id="scores"></div>
  <div id="table">
    <div class="seat" id="seat1"><div class="avatar"></div><div class="sname"></div><div class="scnt"></div></div>
    <div class="seat" id="seat2"><div class="avatar"></div><div class="sname"></div><div class="scnt"></div></div>
    <div class="seat" id="seat3"><div class="avatar"></div><div class="sname"></div><div class="scnt"></div></div>
    <div id="trick"></div>
    <div id="rows"></div>
  </div>
  <div id="hand"></div>
</div>

<div id="toast"></div>
<div id="modalWrap" hidden><div id="modal"></div></div>

<script src="game.js"></script>
</body>
</html>
